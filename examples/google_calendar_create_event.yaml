# Home Assistant Script UI YAML editor; not a complete scripts.yaml mapping.
# Separate from Nabu Recall. Test with an expendable event first.
# Home Assistant timezone: Europe/Budapest.
alias: Naptáresemény létrehozása
description: >-
  Új eseményt hoz létre kizárólag a calendar.esemenyek naptárban.
  Nap: ma, holnap, holnapután, hétfő–vasárnap, 'jövő hét kedd',
  MM-DD vagy YYYY-MM-DD. A nap mezőben relatív dátumot szó szerint adj át.
  Ha a felhasználó nem adott meg évet, MM-DD formátumot használj
  (példa: december elseje -> 12-01); az évet a Home Assistant számítja.
  Soha ne találj ki évet, és az explicit évszámot ne változtasd meg.
  A sima hétköznap a következő még jövőbeli előfordulás;
  a 'jövő hét' mindig a következő hétfő–vasárnap időszak.
  Kötelező az esemény címe, napja és kezdőórája. A perc alapértéke 0.
  Ha a kérés befejezési időt ad meg, használd a vege_ora/vege_perc mezőt;
  ha nem, az időtartam alapértéke 30 perc. Ne írj be múltbeli eseményt.
  Csak sikeres eszközhívás után igazold vissza a létrehozást.
mode: parallel
max: 5
fields:
  esemeny:
    name: Esemény neve
    required: true
    selector:
      text:
  nap:
    name: Nap vagy dátum
    description: ma, holnap, hétköznap, jövő hét kedd, MM-DD, YYYY-MM-DD
    required: true
    selector:
      text:
  ora:
    name: Óra
    required: true
    selector:
      number:
        min: 0
        max: 23
        mode: box
  perc:
    name: Perc
    description: Ha nincs megadva, 0
    selector:
      number:
        min: 0
        max: 59
        mode: box
  idotartam:
    name: Időtartam percben
    description: Csak ha a felhasználó megadja; egyébként 30
    selector:
      number:
        min: 1
        max: 1440
        mode: box
  vege_ora:
    name: Befejezés órája
    description: Ha a felhasználó befejezési időpontot ad, 0–23
    selector:
      number:
        min: 0
        max: 23
        mode: box
  vege_perc:
    name: Befejezés perce
    description: Opcionális, alapértéke 0
    selector:
      number:
        min: 0
        max: 59
        mode: box
sequence:
  - variables:
      aktualis_ido: "{{ now().isoformat() }}"
      nap_szoveg: "{{ nap | default('', true) | string | trim | lower }}"
      cim: "{{ esemeny | default('', true) | string | trim }}"
      h: "{{ ora | default(-1) | int(-1) }}"
      m: "{{ perc | default(0, true) | int(-1) }}"
      hossz: "{{ idotartam | default(30, true) | int(-1) }}"
      hossz_megadva: "{{ idotartam is defined and idotartam is not none and idotartam | string | trim != '' }}"
      v_h: "{{ vege_ora | default(-1) | int(-1) }}"
      v_m: "{{ vege_perc | default(0, true) | int(-1) }}"
  - variables:
      ido_szoveg: "{{ '%02d:%02d:00' | format(h | int, m | int) }}"
  - variables:
      datum_nap: >-
        {% set hetnapok = {'hétfő': 0, 'hétfőn': 0,
                           'kedd': 1, 'kedden': 1,
                           'szerda': 2, 'szerdán': 2,
                           'csütörtök': 3, 'csütörtökön': 3,
                           'péntek': 4, 'pénteken': 4,
                           'szombat': 5, 'szombaton': 5,
                           'vasárnap': 6, 'vasárnapon': 6} %}
        {% set prefix = 'jövő hét ' %}
        {% set jovo_het = nap_szoveg.startswith(prefix) %}
        {% set nev = nap_szoveg[prefix | length:] if jovo_het else nap_szoveg %}
        {% set most = as_datetime(aktualis_ido) %}
        {% set ma = most.date() %}
        {% if nap_szoveg == 'ma' %}
          {{ ma.isoformat() }}
        {% elif nap_szoveg == 'holnap' %}
          {{ (ma + timedelta(days=1)).isoformat() }}
        {% elif nap_szoveg == 'holnapután' %}
          {{ (ma + timedelta(days=2)).isoformat() }}
        {% elif nev in hetnapok %}
          {% set diff = ((7 - most.weekday()) + hetnapok[nev]) if jovo_het
                        else (hetnapok[nev] - most.weekday()) % 7 %}
          {% if diff == 0 and not jovo_het %}
            {% set ma_kezdes = as_datetime(ma.isoformat() ~ 'T' ~ (ido_szoveg | trim), none) %}
            {% if ma_kezdes is none or as_timestamp(as_local(ma_kezdes)) <= as_timestamp(most) %}
              {% set diff = 7 %}
            {% endif %}
          {% endif %}
          {{ (ma + timedelta(days=diff)).isoformat() }}
        {% elif nap_szoveg | regex_match('^[0-9]{2}-[0-9]{2}$') %}
          {% set ns = namespace(jovobeli='invalid') %}
          {% for ev in range(most.year, most.year + 9) %}
            {% if ns.jovobeli == 'invalid' %}
              {% set jelolt = '%04d-%s' | format(ev, nap_szoveg) %}
              {% set dt = as_datetime(jelolt ~ 'T' ~ (ido_szoveg | trim), none) %}
              {% if dt is not none and as_timestamp(as_local(dt)) > as_timestamp(most) %}
                {% set ns.jovobeli = jelolt %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.jovobeli }}
        {% elif nap_szoveg | regex_match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') %}
          {{ nap_szoveg }}
        {% else %}
          invalid
        {% endif %}
  - variables:
      kezdes: >-
        {% set dt = as_datetime((datum_nap | trim) ~ 'T' ~ (ido_szoveg | trim), none) %}
        {{ as_local(dt).isoformat() if dt is not none else 'invalid' }}
  - variables:
      vege: >-
        {% if v_h | int(-1) >= 0 %}
          {% set veg_dt = as_datetime((datum_nap | trim) ~ 'T' ~
                  ('%02d:%02d:00' | format(v_h | int, v_m | int)), none) %}
          {{ as_local(veg_dt).isoformat() if veg_dt is not none else 'invalid' }}
        {% elif (kezdes | trim) != 'invalid' %}
          {{ (as_datetime(kezdes | trim) + timedelta(minutes=hossz | int)).isoformat() }}
        {% else %}
          invalid
        {% endif %}
  - if:
      - condition: template
        value_template: >-
          {{ not cim or (datum_nap | trim) == 'invalid'
             or (kezdes | trim) == 'invalid'
             or h | int < 0 or h | int > 23
             or m | int < 0 or m | int > 59
             or hossz | int < 1 or hossz | int > 1440
             or v_h | int < -1 or v_h | int > 23
             or v_m | int < 0 or v_m | int > 59
             or (vege | trim) == 'invalid'
             or as_timestamp(vege | trim, 0) <= as_timestamp(kezdes | trim, 0)
             or (v_h | int >= 0 and hossz_megadva and
                 ((as_timestamp(vege | trim, 0) - as_timestamp(kezdes | trim, 0)) / 60
                  != hossz | int))
             or as_timestamp(kezdes | trim, 0) <= as_timestamp(now()) }}
    then:
      - stop: "Hibás vagy múltbeli eseményidőpont. Nem történt mentés."
        error: true
  - action: calendar.create_event
    target:
    # FIGYELEM!!! az entity_id mindenkinél más lehet!!! Ellenőrizd a saját naptáradat!
      entity_id: calendar.esemenyek
    data:
      summary: "{{ cim }}"
      start_date_time: "{{ kezdes | trim }}"
      end_date_time: "{{ vege | trim }}"
  - variables:
      eredmeny:
        calendar: calendar.esemenyek
        event: "{{ cim }}"
        start: "{{ kezdes | trim }}"
        end: "{{ vege | trim }}"
  - stop: "Naptáresemény létrehozásának kérése végrehajtva"
    response_variable: eredmeny
