# Standalone Home Assistant Script UI YAML (not an addon-installed file).
# Read-only: never creates, edits, or deletes any calendar event.
# Home Assistant configured local timezone: Europe/Budapest.
alias: Hétvégi naptári programok
description: >-
  A "Mi lesz a programom a hétvégén?" kéréshez KIZÁRÓLAG ezt a szkriptet használd.
  A hétvége szombat 00:00-tól hétfő 00:00-ig tart (a vége kizárólagos).
  A Home Assistant számolja ki az időhatárokat, a pénteki egész napos
  események nem tartoznak ide. A hétvége aktuális vagy következő előfordulását
  kérdezi le a calendar.esemenyek naptárban. A válaszban a kapott events
  mezőt használd; ne egészítsd ki korábbi emlékekkel.
mode: parallel
max: 5
sequence:
  - variables:
      hetvege_kezdete: >-
        {{ (today_at('00:00') +
            timedelta(days=(5 - now().weekday()) if now().weekday() <= 5 else -1)).isoformat() }}
      hetvege_vege: >-
        {{ (today_at('00:00') +
            timedelta(days=7 - now().weekday())).isoformat() }}
  - action: calendar.get_events
    target:
      entity_id: calendar.esemenyek
    data:
      start_date_time: "{{ hetvege_kezdete | trim }}"
      end_date_time: "{{ hetvege_vege | trim }}"
    response_variable: agenda
  - variables:
      eredmeny:
        calendar: calendar.esemenyek
        range_start: "{{ hetvege_kezdete | trim }}"
        range_end: "{{ hetvege_vege | trim }}"
        events: "{{ agenda.get('calendar.esemenyek', {}).get('events', []) }}"
  - stop: "Hétvégi naptárlekérdezés elkészült"
    response_variable: eredmeny
