name: Unit tests and syntax
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q nabu_recall custom_components
      - name: Unit tests
        run: PYTHONPATH=nabu_recall python -m unittest discover -s tests -v
