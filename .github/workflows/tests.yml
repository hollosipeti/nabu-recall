name: Unit tests and syntax
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r nabu_recall/requirements.txt Jinja2 PyYAML
      - name: Compile
        run: python -m compileall -q nabu_recall custom_components
      - name: Unit tests
        run: PYTHONPATH=nabu_recall python -m unittest discover -s tests -v
      - name: Build actual HAOS add-on image
        run: docker build -t nabu-recall-qa:local nabu_recall
      - name: Import running server inside packaged add-on image
        run: >-
          docker run --rm --entrypoint /venv/bin/python
          -e DB_PATH=/tmp/nabu-recall-ci.sqlite3
          nabu-recall-qa:local
          -c "import sys; sys.path.insert(0, '/app'); import server;
          assert server.app is not None; print('ADDON_IMPORT_OK')"
